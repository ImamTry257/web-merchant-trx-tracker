version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MERCHANT_TOKEN: ${VITE_MERCHANT_TOKEN}

    container_name: ${DOCKER_APP_NAME}

    ports:
      - "${DOCKER_APP_PORT}:80"

    restart: unless-stopped

    environment:
      - NODE_ENV=${NODE_ENV}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3