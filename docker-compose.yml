version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${DOCKER_APP_NAME:-merchant-status-tracker}
    ports:
      - "${DOCKER_APP_PORT:-7134}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://host.docker.internal:8787}
      - VITE_MERCHANT_TOKEN=${VITE_MERCHANT_TOKEN:-my-access-token}
    restart: unless-stopped
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ${DOCKER_APP_NAME:-merchant-status-tracker}-nginx
    ports:
      - "80:80"
    environment:
      - NGINX_ENV=${NODE_ENV:-production}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - nginx-only

networks:
  default:
    name: merchant-trx-tracker-network